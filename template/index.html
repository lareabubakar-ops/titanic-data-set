<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>titanic data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body> class="big primary">
    <div class="container mt-5">
        <div class="card shadow p-4"
            <h1 class="card-title mb-4">Titanic Survival Prediction</h1>
            <p class="card-text">Enter the details of a passenger to predict their survival on the Titanic.</p>git
        

        <form action="/predict" method="post">
            <div class="mb-3">
                <label for="pclass" class="form-label">Passenger Class (1, 2, or 3):</label>
                <input type="number" class="form-control" id="pclass" name="pclass" required>
            </div>
            <div class="mb-3">
                <label for="sex" class="form-label">Sex (male or female):</label>
                <input type="text" class="form-control" id="sex" name="sex" required>
            </div>
            <div class="mb-3">
                <label for="age" class="form-label">Age:</label>
                <input type="number" class="form-control" id="age" name="age" required>
            </div>
            <div class="mb-3">
                <label for="sibsp" class="form-label">Number of Siblings/Spouses Aboard:</label>
                <input type="number" class="form-control" id="sibsp" name="sibsp" required>
            </div>
            <div class="mb-3">
                <label for="parch" class="form-label">Number of Parents/Children Aboard:</label>
                <input type="number" class="form-control" id="parch" name="parch" required>
            </div>
            <div class="mb-3">
                <label for="fare" class="form-label">Fare:</label>
                <input type="number" step="0.01" class="form-control" id="fare" name="fare" required>
            </div>
            <button type="submit" class="btn btn-primary">Predict Survival</button>
        </form>

        {% if result %}
            <div class="alert alert-info mt-4" role="alert">
             <h4>The Titanic prediction is: <strong>{{ result }}</strong></h4>
            </div>
        {% endif %}
</body>
</html>
