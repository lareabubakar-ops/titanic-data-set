
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Titanic Survival Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">

            <h1 class="card-title mb-4 text-primary">
                Titanic Survival Prediction
            </h1>

            <p class="card-text">
                Enter the details of a passenger to predict their survival on the Titanic.
            </p>

            <form action="/predict" method="post">

                <div class="mb-3">
                    <label for="pclass" class="form-label">
                        Passenger Class (1, 2, or 3):
                    </label>
                    <input type="number" class="form-control"
                           id="pclass" name="pclass"
                           min="1" max="3" required>
                </div>

                <div class="mb-3">
                    <label for="sex" class="form-label">
                        Sex (male or female):
                    </label>
                    <select class="form-select" id="sex" name="sex" required>
                        <option value="">Select sex</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="age" class="form-label">Age:</label>
                    <input type="number" class="form-control"
                           id="age" name="age"
                           min="0" step="0.1" required>
                </div>

                <div class="mb-3">
                    <label for="sibsp" class="form-label">
                        Number of Siblings/Spouses Aboard:
                    </label>
                    <input type="number" class="form-control"
                           id="sibsp" name="sibsp"
                           min="0" required>
                </div>

                <div class="mb-3">
                    <label for="parch" class="form-label">
                        Number of Parents/Children Aboard:
                    </label>
                    <input type="number" class="form-control"
                           id="parch" name="parch"
                           min="0" required>
                </div>

                <div class="mb-3">
                    <label for="fare" class="form-label">Fare:</label>
                    <input type="number" class="form-control"
                           id="fare" name="fare"
                           min="0" step="0.01" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Predict Survival
                </button>

            </form>

            {% if result %}
            <div class="alert alert-info mt-4" role="alert">
                <h4>
                    Titanic Prediction:
                    <strong>{{ result }}</strong>
                </h4>
            </div>
            {% endif %}

        </div>
    </div>

</body>
</html>
